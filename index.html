<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SCREEN 1: log in / sign up -->
  <section id="auth-screen">
    <div class="card">
      <h1>Chat</h1>
      <p class="subtitle">MESSAGES WITH FRIENDS</p>

      <div class="tabs">
        <button id="tab-login" class="tab active" type="button">Log in</button>
        <button id="tab-signup" class="tab" type="button">Sign up</button>
      </div>

      <form id="auth-form">
        <input id="username" type="text" placeholder="Username (a-z, 0-9, _)" autocomplete="username" hidden>
        <input id="email" type="email" placeholder="Email" required autocomplete="email">
        <input id="password" type="password" placeholder="Password (6+ characters)" required minlength="6" autocomplete="current-password">
        <button id="auth-submit" type="submit">Log in</button>
        <p id="auth-error" class="error"></p>
      </form>
    </div>
  </section>

  <!-- SCREEN 2: the app -->
  <section id="app-screen" hidden>
    <aside id="sidebar">
      <header>
        <span>Hi, <b id="me-name"></b></span>
        <button id="logout-btn" class="ghost" type="button">Log out</button>
      </header>

      <form id="add-friend-form">
        <input id="friend-input" type="text" placeholder="Friend's username" required>
        <button type="submit">Chat</button>
      </form>
      <p id="friend-error" class="error"></p>

      <ul id="chat-list"></ul>
    </aside>

    <main id="chat-panel">
      <header>
        <button id="back-btn" class="ghost" type="button">&larr;</button>
        <b id="chat-title">Pick a chat</b>
      </header>

      <div id="messages"></div>

      <form id="message-form" hidden>
        <input id="message-input" type="text" placeholder="Type a message" maxlength="1000" autocomplete="off" required>
        <button type="submit">Send</button>
      </form>
    </main>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
